<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishHunt</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 380px;
            min-height: 480px;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: #ffffff;
        }

        .container {
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 34px;
            margin-bottom: 5px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: #00e5ff;
        }

        .subtitle {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 5px;
        }

        .url-box {
            background: #151b2e;
            border: 1px solid #28334f;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .label {
            font-size: 11px;
            color: #8b95aa;
            margin-bottom: 6px;
        }

        #url {
            font-size: 13px;
            color: #dbeafe;
            word-break: break-all;
            line-height: 1.5;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: #00c8ff;
            color: #06111a;
            transition: 0.2s;
        }

        button:hover {
            background: #00e5ff;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 18px;
            color: #9ca3af;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #28334f;
            border-top: 3px solid #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .result {
            display: none;
            margin-top: 18px;
        }

        .result-card {
            border-radius: 12px;
            padding: 16px;
            background: #151b2e;
            border: 1px solid #28334f;
        }

        .result-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .legitimate {
            color: #22c55e;
        }

        .suspicious {
            color: #f59e0b;
        }

        .phishing {
            color: #ef4444;
        }

        .info {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid #28334f;
            font-size: 13px;
        }

        .info:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #9ca3af;
        }

        .info-value {
            text-align: right;
            font-weight: bold;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #3a1518;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            font-size: 13px;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 10px;
            color: #64748b;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🛡️</div>
        <div class="title">PhishHunt</div>
        <div class="subtitle">
            ML + Cybersecurity Phishing Detection
        </div>
    </div>

    <div class="url-box">
        <div class="label">CURRENT WEBSITE</div>
        <div id="url">Loading current URL...</div>
    </div>

    <button id="analyzeBtn">
        🔍 Analyze Website
    </button>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        Analyzing URL...
    </div>

    <div class="error" id="error"></div>

    <div class="result" id="result">

        <div class="result-card">

            <div class="result-title" id="resultTitle">
                RESULT
            </div>

            <div class="info">
                <span class="info-label">ML Prediction</span>
                <span class="info-value" id="mlPrediction">-</span>
            </div>

            <div class="info">
                <span class="info-label">ML Confidence</span>
                <span class="info-value" id="mlConfidence">-</span>
            </div>

            <div class="info">
                <span class="info-label">Risk Score</span>
                <span class="info-value" id="riskScore">-</span>
            </div>

            <div class="info">
                <span class="info-label">Security Decision</span>
                <span class="info-value" id="securityDecision">-</span>
            </div>

        </div>

    </div>

    <div class="footer">
        PhishHunt • Cybersecurity Minor Project
    </div>

</div>

<script src="popup.js"></script>

</body>
</html>
