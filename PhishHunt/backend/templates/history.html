<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhishHunt - Scan History</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .history-page {
            width: 94%;
            max-width: 1400px;
            margin: 40px auto;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .history-header h1 {
            margin: 0;
            font-size: 32px;
        }

        .history-header p {
            margin-top: 8px;
            opacity: 0.7;
        }

        .history-actions {
            display: flex;
            gap: 12px;
        }

        .history-btn {
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: white;
            background: #2b8cff;
            text-decoration: none;
        }

        .history-btn:hover {
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 22px;
        }

        .stat-card h3 {
            margin: 0;
            font-size: 14px;
            opacity: 0.7;
        }

        .stat-number {
            margin-top: 10px;
            font-size: 30px;
            font-weight: 700;
        }

        .history-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 20px;
            overflow-x: auto;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        .history-table th {
            text-align: left;
            padding: 15px;
            font-size: 13px;
            opacity: 0.7;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            vertical-align: middle;
        }

        .url-cell {
            max-width: 300px;
            word-break: break-all;
        }

        .result-badge {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .legitimate {
            background: rgba(70, 220, 120, 0.15);
            color: #65e890;
        }

        .phishing {
            background: rgba(255, 80, 80, 0.15);
            color: #ff7777;
        }

        .suspicious {
            background: rgba(255, 180, 50, 0.15);
            color: #ffc15a;
        }

        .risk-score {
            font-weight: 700;
        }

        .empty-history {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.7;
        }

        .loading-history {
            text-align: center;
            padding: 50px;
            opacity: 0.7;
        }

        .error-history {
            text-align: center;
            padding: 40px;
            color: #ff7777;
        }

        @media (max-width: 900px) {

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .history-page {
                width: 92%;
            }
        }

        @media (max-width: 500px) {

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .history-header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>


<body>

    <main class="history-page">

        <div class="history-header">

            <div>
                <h1>🔎 PhishHunt Scan History</h1>

                <p>
                    Review previously analyzed URLs and their security results.
                </p>
            </div>

            <div class="history-actions">

                <a href="/" class="history-btn">
                    ← Analyze URL
                </a>

                <button
                    class="history-btn"
                    onclick="loadHistory()">
                    ↻ Refresh
                </button>

            </div>

        </div>


        <!-- Statistics -->

        <section class="stats-grid">

            <div class="stat-card">

                <h3>Total Scans</h3>

                <div
                    class="stat-number"
                    id="totalScans">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>Legitimate</h3>

                <div
                    class="stat-number legitimate"
                    id="legitimateCount">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>Phishing</h3>

                <div
                    class="stat-number phishing"
                    id="phishingCount">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>Suspicious</h3>

                <div
                    class="stat-number suspicious"
                    id="suspiciousCount">
                    0
                </div>

            </div>

        </section>


        <!-- History Table -->

        <section class="history-container">

            <div id="historyContent">

                <div class="loading-history">
                    Loading scan history...
                </div>

            </div>

        </section>

    </main>


<script>

async function loadHistory() {

    const container =
        document.getElementById("historyContent");

    container.innerHTML =
        '<div class="loading-history">Loading scan history...</div>';

    try {

        const response =
            await fetch("/api/history");

        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error || "Unable to load history"
            );

        }


        const history =
            data.history || [];


        updateStatistics(history);


        if (history.length === 0) {

            container.innerHTML = `
                <div class="empty-history">

                    <h2>No scans yet</h2>

                    <p>
                        Analyze a URL to create your first
                        scan history entry.
                    </p>

                </div>
            `;

            return;
        }


        let tableHTML = `

            <table class="history-table">

                <thead>

                    <tr>

                        <th>#</th>

                        <th>URL</th>

                        <th>Final Result</th>

                        <th>ML Prediction</th>

                        <th>Confidence</th>

                        <th>Risk Score</th>

                        <th>Security Decision</th>

                        <th>Date & Time</th>

                    </tr>

                </thead>

                <tbody>
        `;


        history.forEach((item, index) => {

            const finalClass =
                getResultClass(item.final_result);

            const securityClass =
                getResultClass(item.security_decision);


            tableHTML += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>


                    <td class="url-cell">
                        ${escapeHTML(item.url)}
                    </td>


                    <td>

                        <span
                            class="result-badge ${finalClass}">
                            ${escapeHTML(item.final_result)}
                        </span>

                    </td>


                    <td>
                        ${escapeHTML(item.ml_prediction || "-")}
                    </td>


                    <td>
                        ${item.ml_confidence ?? "-"}%
                    </td>


                    <td class="risk-score">
                        ${item.risk_score ?? 0}/100
                    </td>


                    <td>

                        <span
                            class="result-badge ${securityClass}">
                            ${escapeHTML(item.security_decision || "-")}
                        </span>

                    </td>


                    <td>
                        ${escapeHTML(item.timestamp || "-")}
                    </td>

                </tr>
            `;

        });


        tableHTML += `

                </tbody>

            </table>
        `;


        container.innerHTML =
            tableHTML;


    } catch (error) {

        console.error(
            "History error:",
            error
        );


        container.innerHTML = `

            <div class="error-history">

                <h2>Unable to load history</h2>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;

    }

}


function updateStatistics(history) {

    const total =
        history.length;


    const legitimate =
        history.filter(
            item =>
                item.final_result === "LEGITIMATE"
        ).length;


    const phishing =
        history.filter(
            item =>
                item.final_result === "PHISHING"
        ).length;


    const suspicious =
        history.filter(
            item =>
                item.final_result === "SUSPICIOUS"
        ).length;


    document.getElementById(
        "totalScans"
    ).textContent = total;


    document.getElementById(
        "legitimateCount"
    ).textContent = legitimate;


    document.getElementById(
        "phishingCount"
    ).textContent = phishing;


    document.getElementById(
        "suspiciousCount"
    ).textContent = suspicious;

}


function getResultClass(result) {

    if (!result) {
        return "suspicious";
    }


    const value =
        result.toUpperCase();


    if (value === "LEGITIMATE") {
        return "legitimate";
    }


    if (value === "PHISHING") {
        return "phishing";
    }


    return "suspicious";

}


function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        String(value ?? "");

    return div.innerHTML;

}


loadHistory();

</script>

</body>

</html>
